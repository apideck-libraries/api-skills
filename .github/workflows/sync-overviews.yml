name: Sync Connector Overviews

# Keeps connectors/overviews.json (and the generated "At a glance" sections)
# in step with Apideck's connector metadata API — the single source of truth.
# When the synced output differs from main, this opens/updates a PR with the
# regenerated files; when nothing changed, it exits quietly with no PR.
#
# Triggers:
#   - weekly schedule (overviews change at documentation pace)
#   - manual dispatch (Actions tab → Run workflow)
#   - repository_dispatch type "sync-overviews" (lets the unify repo ping this
#     the moment a connector overview merges, if/when that hook is added)
#
# Requires two repo secrets: APIDECK_API_KEY, APIDECK_APP_ID.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [sync-overviews]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-overviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        env:
          APIDECK_API_KEY: ${{ secrets.APIDECK_API_KEY }}
          APIDECK_APP_ID: ${{ secrets.APIDECK_APP_ID }}
        run: |
          if [ -z "$APIDECK_API_KEY" ] || [ -z "$APIDECK_APP_ID" ]; then
            echo "::error::APIDECK_API_KEY / APIDECK_APP_ID repo secrets are not set — cannot sync."
            exit 1
          fi

      - name: Sync overviews from the connector metadata API
        env:
          APIDECK_API_KEY: ${{ secrets.APIDECK_API_KEY }}
          APIDECK_APP_ID: ${{ secrets.APIDECK_APP_ID }}
        # Fails (and writes nothing) on any HTTP/network error, so a partial
        # sync can never reach the PR step.
        run: node connectors/sync-overviews.js

      - name: Regenerate skills and provider mirrors
        run: |
          node connectors/generate.js
          node skills/sync.js --skills-only

      - name: Validate
        run: |
          node connectors/validate.js --strict
          node skills/test.js

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Overviews are already in sync — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open or update sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=auto/sync-overviews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync connector overviews from the metadata API"
          git push -f origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            cat > /tmp/pr-body.md <<'BODY'
          Automated sync of `connectors/overviews.json` from Apideck's connector metadata API (`GET /connector/connectors/{id}` → `overview`), with skills regenerated and provider mirrors re-synced.

          Produced by the `sync-overviews` workflow — content is machine-synced, validated by `connectors/validate.js --strict` and `skills/test.js` before this PR was opened. Review and merge; do not edit the generated files by hand.
          BODY
            gh pr create \
              --head "$BRANCH" \
              --title "chore: sync connector overviews" \
              --body-file /tmp/pr-body.md
          else
            echo "Open PR for $BRANCH already exists — branch updated in place."
          fi
