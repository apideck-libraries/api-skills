name: Sync Connector Overviews

# Keeps connectors/overviews.json (and the generated "At a glance" sections)
# in step with Apideck's connector metadata API — the single source of truth.
# When the synced output differs from main, this opens/updates a PR with the
# regenerated files; when nothing changed, no PR is opened.
#
# Same shape as developer-docs' regenerate-markdown workflow (weekly cron →
# sync from the connector API → regenerate committed artifacts → auto-PR via
# peter-evans/create-pull-request).
#
# Triggers:
#   - weekly schedule (overviews change at documentation pace)
#   - manual dispatch (Actions tab → Run workflow)
#   - repository_dispatch type "sync-overviews" (lets the unify repo ping this
#     the moment a connector overview merges, if/when that hook is added)
#
# Requires two repo secrets: APIDECK_API_KEY, APIDECK_APP_ID (same values as
# developer-docs' API_KEY / APP_ID).

on:
  schedule:
    # Mondays 06:17 UTC — a PR is waiting at the start of the week, after
    # any Friday connector/doc updates.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-overviews]

concurrency:
  group: sync-overviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        env:
          APIDECK_API_KEY: ${{ secrets.APIDECK_API_KEY }}
          APIDECK_APP_ID: ${{ secrets.APIDECK_APP_ID }}
        run: |
          if [ -z "$APIDECK_API_KEY" ] || [ -z "$APIDECK_APP_ID" ]; then
            echo "::error::APIDECK_API_KEY / APIDECK_APP_ID repo secrets are not set — cannot sync."
            exit 1
          fi

      - name: Sync overviews from the connector metadata API
        env:
          APIDECK_API_KEY: ${{ secrets.APIDECK_API_KEY }}
          APIDECK_APP_ID: ${{ secrets.APIDECK_APP_ID }}
        # Fails (and writes nothing) on any HTTP/network error, so a partial
        # sync can never reach the PR step.
        run: node connectors/sync-overviews.js

      - name: Regenerate skills and provider mirrors
        run: |
          node connectors/generate.js
          node skills/sync.js --skills-only

      - name: Validate
        run: |
          node connectors/validate.js --strict
          node skills/test.js

      - name: Open PR if overviews drifted
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sync-overviews
          commit-message: "chore: sync connector overviews from the metadata API"
          title: "chore: sync connector overviews"
          body: |
            Automated sync of `connectors/overviews.json` from Apideck's connector
            metadata API (`GET /connector/connectors/{id}` → `overview`), with
            skills regenerated and provider mirrors re-synced.

            Produced by the `sync-overviews` workflow — content is machine-synced
            and validated (`connectors/validate.js --strict`, `skills/test.js`)
            before this PR was opened. Review and merge; do not edit the generated
            files by hand.

            If nothing changed, this PR is not opened; if it already exists, the
            branch is updated in place.
